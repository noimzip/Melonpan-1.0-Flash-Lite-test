  <meta charset="UTF-8">

  <title>Markdown超入門スライド</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', sans-serif;
      background: #1a1a2e;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .slide-wrapper {
      width: 100%;
      max-width: 1100px;
    }

    .slide-container {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.5);
    }

    .controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 20px;
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: white;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.2s;
    }

    .ctrl-btn:hover {
      background: rgba(255, 255, 255, 0.2);
    }

    .ctrl-btn:disabled {
      opacity: 0.3;
      cursor: default;
    }

    .slide-counter {
      color: rgba(255, 255, 255, 0.7);
      font-size: 14px;
      font-weight: 500;
      min-width: 80px;
      text-align: center;
    }

    .progress-bar {
      width: 100%;
      height: 3px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
      margin-top: 14px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: #84B59F;
      border-radius: 2px;
      transition: width 0.3s ease;
    }
  </style>
</head>

<body>

  <div class="slide-wrapper">
    <!-- スライド表示エリア -->
    <div class="slide-container" id="slide-viewport">
      <!-- スライドがここにレンダリングされます -->
    </div>

    <!-- プログレスバー -->
    <div class="progress-bar">
      <div class="progress-fill" id="progress-fill"></div>
    </div>

    <!-- コントロール -->
    <div class="controls">
      <button class="ctrl-btn" onclick="prevSlide()" id="btn-prev" disabled>
        <i data-lucide="chevron-left" style="width:20px;height:20px;"></i>
      </button>
      <span class="slide-counter" id="slide-counter">1 / 12</span>
      <button class="ctrl-btn" onclick="nextSlide()" id="btn-next">
        <i data-lucide="chevron-right" style="width:20px;height:20px;"></i>

    let currentSlideIndex = 0;

    function renderSlide(index) {
      const viewport = document.getElementById("slide-viewport");
      viewport.innerHTML = slideData[index].html;

      // カウンター更新
      document.getElementById("slide-counter").innerText = `${index + 1} / ${slideData.length}`;

      // プログレスバー更新
      const pct = ((index + 1) / slideData.length) * 100;
      document.getElementById("progress-fill").style.width = pct + "%";

      // ボタンの有効/無効
      document.getElementById("btn-prev").disabled = (index === 0);
      document.getElementById("btn-next").disabled = (index === slideData.length - 1);

      // アイコンの再適用
      lucide.createIcons();
    }

    function nextSlide() {
      if (currentSlideIndex < slideData.length - 1) {
        currentSlideIndex++;
        renderSlide(currentSlideIndex);
      }
    }

    function prevSlide() {
      if (currentSlideIndex > 0) {
        currentSlideIndex--;
        renderSlide(currentSlideIndex);
      }
    }

    // キーボード操作
    document.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowDown" || e.key === " ") {
        e.preventDefault();
        nextSlide();
      } else if (e.key === "ArrowLeft" || e.key === "ArrowUp") {
        e.preventDefault();
        prevSlide();
      }
    });

    window.onload = function () {
      renderSlide(currentSlideIndex);
    };
  </script>
