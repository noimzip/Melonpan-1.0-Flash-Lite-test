        }

        function resetCommitSimulation() {
            isCommitted = false;
            renderSlide(currentSlideIndex);
        }

        // スライド8：プッシュ発送シミュレーション
        function executePush() {
            if (isPushed) return;

            isPushed = true;
            const truck = document.getElementById('delivery-truck');
            const status = document.getElementById('push-status');
            const btn = document.getElementById('btn-push-action');
            const github = document.getElementById('github-hq');

            truck.className = "absolute top-2 z-10 animate-truck";
            status.innerHTML = "🚚 トラックがインターネットを快走して、配送しています...";
            btn.disabled = true;
            btn.innerHTML = "配送中...";

            // 3秒後に配送完了演出
            setTimeout(() => {
                if (currentSlideIndex === 7) { // ユーザーが別のスライドへ進んでいない場合のみDOM操作
                    status.innerHTML = '<span class="text-emerald-600 font-bold font-serif text-sm">🎉 発送完了！GitHub中央倉庫に保存されました！</span>';
                    btn.className = "bg-emerald-600 text-white font-bold px-6 py-2 rounded-full cursor-not-allowed text-xs shadow-md pointer-events-none";
                    btn.innerHTML = "発送済み";
                    github.className = "w-14 h-14 bg-emerald-600 text-white rounded-xl flex flex-col items-center justify-center shadow-lg transform scale-110 duration-500";
                    showToast("GitHubに無事届きました！");
                }
            }, 3000);
        }

        function resetPushSimulation() {
            isPushed = false;
            renderSlide(currentSlideIndex);
        }

        // スライド9：ブランチ分岐シミュレーション
        function executeBranch() {
            if (isBranched) return;

            isBranched = true;
            const line = document.getElementById('branch-line');
            const node1 = document.getElementById('branch-node-1');
            const node2 = document.getElementById('branch-node-2');
            const text = document.getElementById('branch-text');
            const status = document.getElementById('branch-status');
            const btn = document.getElementById('btn-branch-action');

            line.classList.remove('hidden');
            node1.classList.remove('hidden');
            node2.classList.remove('hidden');
            text.classList.remove('hidden');

            setTimeout(() => {
                line.className = "absolute left-28 right-12 top-20 h-1 bg-amber-500 rounded block opacity-100 transition-all duration-500";
                node1.className = "absolute left-44 top-18 w-5 h-5 bg-amber-500 rounded-full border-2 border-white flex items-center justify-center text-[8px] text-white font-bold shadow block opacity-100 transition-all duration-500";
                node2.className = "absolute right-12 top-18 w-5 h-5 bg-amber-500 rounded-full border-2 border-white flex items-center justify-center text-[8px] text-white font-bold shadow block opacity-100 transition-all duration-500";
                text.className = "absolute left-28 top-24 text-[9px] text-amber-600 font-bold block opacity-100 transition-all duration-500";
            }, 50);

            status.innerHTML = '<span class="text-amber-600 font-bold animate-pulse">🌿 パラレルワールド（new-feature）が分岐されました！</span>';
            btn.className = "bg-amber-600 text-white font-bold px-5 py-2 rounded-lg cursor-not-allowed text-xs shadow pointer-events-none";
            btn.innerHTML = "ブランチ分岐完了！";

            showToast("新しい作業用の机（ブランチ）を用意しました！");
        }

        function resetBranchSimulation() {
            isBranched = false;
            renderSlide(currentSlideIndex);
        }
    </script>
</body>
</html>
